# Iteration 5: fan-out over a shared long prefix (LLM reranker over K beam candidates).
# Shared prefix = 24-turn append-history Tetris prompt (~15k tokens, fresh nonce per trial);
# K questions differ only in a ~30-token suffix. One trial at a time per model; models side by side.
iteration: 5
name: fanout_shared_prefix
models:
  - openai/gpt-oss-20b            # fast prefill, large cache, cached $0
  - openai/gpt-oss-120b           # cached $0
  - deepseek-ai/DeepSeek-V4-Flash # slow serialized prefill, small cache, no cached price
k_values: [4, 8]
strategies: [cold_fanout, primed_fanout, sequential]
trials: 3
history_turns: 24
pause_s: 3.0
budget_usd: 2.0
