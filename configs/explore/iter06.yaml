# Iteration 6: model ladder on the best configuration found (stateless, static-first prompt,
# annotated legal ids) + constrained output (json_schema enum of legal ids) so that formatting
# failures don't masquerade as bad decisions. Direct answers wherever reasoning can be disabled;
# gpt-oss keeps reasoning_effort=low (its minimum); one decode-bound arm (gpt-oss-120b, medium).
# MiniMax-M2.5 is excluded: it cannot disable reasoning and exceeded 2048 reasoning tokens
# (~20 s, no answer) on 3/3 smoke-test moves.
iteration: 6
name: model_ladder
model: openai/gpt-oss-20b
seeds: [1000, 1001, 1002]
max_pieces: 100
budget_usd: 4.0
concurrency: 6                   # attempt 1 at 16 drew ~90 HTTP 429s per minute (7% of moves fell back)
oracle: {n_samples: 2, depth: 4, beam_h: 2, beam_w: 4, beam_samples: 1}
defaults: {history: stateless, annotated: true, layout: static_first, response_format: json_schema, max_tokens: 32}
arms:
  gpt-oss-20b/low:         {model: openai/gpt-oss-20b, max_tokens: 1024}
  gpt-oss-120b/low:        {model: openai/gpt-oss-120b, max_tokens: 1024}
  gpt-oss-120b/medium:     {model: openai/gpt-oss-120b, max_tokens: 4096, chat_kwargs: {reasoning_effort: medium}}
  gemma-4-31B/direct:      {model: google/gemma-4-31B-it}
  DeepSeek-V4-Flash/direct: {model: deepseek-ai/DeepSeek-V4-Flash}
  Qwen3.8-27B/direct:      {model: Qwen/Qwen3.8-27B-FP8}
  Qwen3.5-397B/direct:     {model: Qwen/Qwen3.5-397B-A17B-FP8}
  Kimi-K2.7/direct:        {model: moonshotai/Kimi-K2.7-Code, chat_kwargs: {reasoning_effort: null, extra_body: {chat_template_kwargs: {enable_thinking: false}}}}
  GLM-5.2/direct:          {model: lukealonso/GLM-5.2-NVFP4}
