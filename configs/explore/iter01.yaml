# Iteration 1: does cache-friendly memory come for free, and does cache-hostile memory cost?
iteration: 1
name: history_policies
model: openai/gpt-oss-20b
seeds: [1000, 1001, 1002]        # episode_seed; identical piece sequences across arms (paired)
max_pieces: 100
budget_usd: 5.0
concurrency: 12                  # all arm x seed episodes in flight together -> arms interleaved in time
oracle: {n_samples: 2, depth: 4, beam_h: 2, beam_w: 4, beam_samples: 1}
defaults: {annotated: true, max_tokens: 1024, response_format: none, layout: static_first}
arms:
  stateless: {history: stateless}
  append:    {history: append}
  window8:   {history: window, window: 8}
  compact16: {history: compact, compact_every: 16}
